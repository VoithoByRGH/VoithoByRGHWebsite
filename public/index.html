<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO -->
    <title>VoithóByRGH · Photography & Cinematic Films in Cyprus</title>
    <meta
      name="description"
      content="VoithóByRGH creates editorial photography and cinematic films for brands, people, real estate, automotive, and beautiful spaces across Cyprus."
    />
    <meta
      name="keywords"
      content="Cyprus photographer, Cyprus videographer, Paphos photographer, Paphos videographer, editorial photography, automotive photography, real estate photography, cinematic films, brand films"
    />
    <link rel="canonical" href="https://voithobyrgh.com/" />
    <meta name="robots" content="index,follow" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoithóByRGH" />
    <meta
      property="og:title"
      content="VoithóByRGH · Photography & Cinematic Films in Cyprus"
    />
    <meta
      property="og:description"
      content="Editorial photography and cinematic films for brands, people, automotive, and spaces across Cyprus."
    />
    <meta property="og:url" content="https://voithobyrgh.com/" />
    <meta property="og:image" content="https://voithobyrgh.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VoithóByRGH · Photography & Cinematic Films in Cyprus"
    />
    <meta
      name="twitter:description"
      content="Editorial photography and cinematic films for brands, people, automotive, and spaces across Cyprus."
    />
    <meta name="twitter:image" content="https://voithobyrgh.com/og-image.jpg" />

    <!-- JSON-LD (LocalBusiness schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "VoithóByRGH",
        "url": "https://voithobyrgh.com/",
        "image": "https://voithobyrgh.com/og-image.jpg",
        "email": "info@voithobyrgh.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Paphos",
          "addressCountry": "CY"
        },
        "areaServed": "Cyprus",
        "sameAs": ["https://instagram.com/voithobyrgh"],
        "description": "Editorial photography and cinematic films in Cyprus for brands, people, automotive, and spaces."
      }
    </script>

    <!-- Manifest + Icons -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/vicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN config -->
    <script>
      tailwind = {
        theme: {
          extend: {
            colors: {
              accent: "#D4AF37",
              ink: "#EAEAEA",
              panel: "rgba(255,255,255,0.04)",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Cormorant Garamond", "serif"],
            },
            borderRadius: {
              xl2: "1.25rem",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-black text-white font-sans">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Netlify hidden form (for submissions) -->
    <form
      name="enquiry"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
